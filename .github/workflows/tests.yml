name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # net48 needs a Windows runner. The reference assemblies come from the
    # Microsoft.NETFramework.ReferenceAssemblies package, so no Visual Studio is needed.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/Federator.Core.Tests/Federator.Core.Tests.csproj

      - name: Test
        run: dotnet test tests/Federator.Core.Tests/Federator.Core.Tests.csproj --nologo -v minimal

      # The add-in cannot be built by any runner, because no runner has Navisworks on it.
      # This is the one rule of the compiler's that can be run without it, and it is the
      # one that cost a day between F52 and F58.
      - name: No local declared twice
        shell: bash
        run: sh tools/checks/check-locals.sh src

      # A check that only ever runs against a clean tree proves nothing. This folder is
      # wrong on purpose and the check has to refuse it.
      - name: The check refuses the fault it was written for
        shell: bash
        run: |
          if sh tools/checks/check-locals.sh tools/checks/broken; then
            echo "check-locals passed a folder it is supposed to refuse"
            exit 1
          fi
          echo "check-locals refused the broken folder, which is what it is for"

      # The second rule of the compiler's that runs without it. F61 shipped a file naming a
      # type whose namespace it did not import, which is CS0246, and the add-in did not
      # build on 2026-09-19. check-locals reads one shape of fault and this is another.
      - name: No file names a type it does not import
        shell: bash
        run: sh tools/checks/check-imports.sh src

      # The same folder, wrong on purpose in a second way, and this check has to refuse it
      # as well. A check that only ever runs against a clean tree proves nothing.
      - name: The import check refuses the fault it was written for
        shell: bash
        run: |
          if sh tools/checks/check-imports.sh tools/checks/broken; then
            echo "check-imports passed a folder it is supposed to refuse"
            exit 1
          fi
          echo "check-imports refused the broken folder, which is what it is for"

      # F102. A probe result committed from Bader's machine carried the machine's name and
      # two Autodesk licensing ids. Every text file in the tree is read for them. It names
      # the file, the line and the kind, never the text, because this log is public.
      # COMPUTERNAME here is the runner's, so this reads for the runner's name.
      - name: No machine name or licensing id in a committed file
        shell: bash
        run: sh tools/checks/check-evidence-ids.sh . tools/checks/broken

      # The broken folder holds fabricated ids, all zeros, and a made up machine name. The
      # check must refuse exactly the four lines that carry one and nothing in the near miss.
      - name: The id check refuses the fault it was written for
        shell: bash
        run: |
          status=0
          said=$(COMPUTERNAME=MADEUPPC01 sh tools/checks/check-evidence-ids.sh tools/checks/broken) || status=$?
          echo "$said"
          if [ "$status" -ne 1 ]; then
            echo "check-evidence-ids answered $status over the broken folder, and it has to refuse it with 1"
            exit 1
          fi
          for want in \
              "EvidenceWithIds.txt:1  the machine name" \
              "EvidenceWithIds.txt:2  an analytics agent id" \
              "EvidenceWithIds.txt:2  a licensing id after -i" \
              "EvidenceWithIds.txt:3  a licensing id after -i" \
              "check-evidence-ids: 4 line(s)"; do
            case "$said" in
              *"$want"*) ;;
              *) echo "check-evidence-ids did not say: $want"; exit 1 ;;
            esac
          done
          case "$said" in
            *EvidenceNearMiss.txt*)
              echo "check-evidence-ids refused a line of the near miss, which it must pass"
              exit 1
              ;;
          esac
          echo "check-evidence-ids refused the four lines with an id and passed the near miss, which is what it is for"
