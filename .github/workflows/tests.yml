name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # net48 needs a Windows runner. The reference assemblies come from the
    # Microsoft.NETFramework.ReferenceAssemblies package, so no Visual Studio is needed.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/Federator.Core.Tests/Federator.Core.Tests.csproj

      - name: Test
        run: dotnet test tests/Federator.Core.Tests/Federator.Core.Tests.csproj --nologo -v minimal

      # The add-in cannot be built by any runner, because no runner has Navisworks on it.
      # This is the one rule of the compiler's that can be run without it, and it is the
      # one that cost a day between F52 and F58.
      - name: No local declared twice
        shell: bash
        run: sh tools/checks/check-locals.sh src

      # A check that only ever runs against a clean tree proves nothing. This folder is
      # wrong on purpose and the check has to refuse it.
      - name: The check refuses the fault it was written for
        shell: bash
        run: |
          if sh tools/checks/check-locals.sh tools/checks/broken; then
            echo "check-locals passed a folder it is supposed to refuse"
            exit 1
          fi
          echo "check-locals refused the broken folder, which is what it is for"

      # The second rule of the compiler's that runs without it. F61 shipped a file naming a
      # type whose namespace it did not import, which is CS0246, and the add-in did not
      # build on 2026-09-19. check-locals reads one shape of fault and this is another.
      - name: No file names a type it does not import
        shell: bash
        run: sh tools/checks/check-imports.sh src

      # The same folder, wrong on purpose in a second way, and this check has to refuse it
      # as well. A check that only ever runs against a clean tree proves nothing.
      - name: The import check refuses the fault it was written for
        shell: bash
        run: |
          if sh tools/checks/check-imports.sh tools/checks/broken; then
            echo "check-imports passed a folder it is supposed to refuse"
            exit 1
          fi
          echo "check-imports refused the broken folder, which is what it is for"

      # F102. A probe result committed from Bader's machine carried the machine's name and
      # two Autodesk licensing ids. Every file in the tree is read as text for every kind in
      # tools/checks/evidence-ids.txt, or named and refused. Left out: tools/checks/broken,
      # whose faults are on purpose, .git, bin and obj, and a .jpg or .xlsx under samples
      # whose first and last bytes are its format's own. It names the file, the line and the kind,
      # never the text, because this log is public. COMPUTERNAME here is the runner's, so
      # this reads for the runner's name and never for Bader's. Only the pre-commit on his
      # machine reads for his.
      - name: No machine name or licensing id in a committed file
        shell: bash
        run: sh tools/checks/check-evidence-ids.sh . tools/checks/broken

      # The broken folder holds fabricated ids, all zeros, a made up machine name, a UTF-16
      # file, two text files at samples shaped paths, and a jpg and an xlsx there that open
      # with their format's bytes and end wrong. The check must refuse exactly these twenty
      # lines, nothing in the near miss, the masked copy or the rules fixtures, and never
      # print the name or an id. A binary file is refused in words that say it is binary.
      - name: The id check refuses the fault it was written for
        shell: bash
        run: |
          status=0
          said=$(COMPUTERNAME=MADEUPPC01 sh tools/checks/check-evidence-ids.sh tools/checks/broken) || status=$?
          echo "$said"
          if [ "$status" -ne 1 ]; then
            echo "check-evidence-ids answered $status over the broken folder, and it has to refuse it with 1"
            exit 1
          fi
          want="tools/checks/broken/EvidenceLeftByMask.txt:2  the machine name
          tools/checks/broken/EvidenceUtf16.txt  is binary, a NUL byte is in it, and no line of the binary rule at the top of the check names it
          tools/checks/broken/EvidenceWithIds.txt:1  the machine name
          tools/checks/broken/EvidenceWithIds.txt:2  a GUID on a line naming analyticsagentid
          tools/checks/broken/EvidenceWithIds.txt:2  a GUID on a licensing line
          tools/checks/broken/EvidenceWithIds.txt:2  an analytics agent id
          tools/checks/broken/EvidenceWithIds.txt:2  an id after -i
          tools/checks/broken/EvidenceWithIds.txt:3  a GUID on a licensing line
          tools/checks/broken/EvidenceWithIds.txt:3  an id after -i
          tools/checks/broken/EvidenceWithIds.txt:4  a GUID on a licensing line
          tools/checks/broken/EvidenceWithIds.txt:5  a GUID on a licensing line
          tools/checks/broken/EvidenceWithIds.txt:6  a GUID on a line naming analyticsagentid
          tools/checks/broken/EvidenceWithIds.txt:6  an analytics agent id
          tools/checks/broken/EvidenceWithIds.txt:7  an id after -i
          tools/checks/broken/EvidenceWithIds.txt:8  an analytics agent id
          tools/checks/broken/EvidenceWithIds.txt:8  an id after -i
          tools/checks/broken/samples/client-report/EndsWrong.jpg  is binary at a path the binary rule names, but its first or last bytes are not those of its format, so it is not left out
          tools/checks/broken/samples/client-report/EndsWrong.xlsx  is binary at a path the binary rule names, but its first or last bytes are not those of its format, so it is not left out
          tools/checks/broken/samples/client-report/NotAPicture.jpg:2  the machine name
          tools/checks/broken/samples/client-report/NotAWorkbook.xlsx:2  the machine name"
          got=$(printf '%s\n' "$said" | awk '!/^check-evidence-ids:/' | LC_ALL=C sort)
          want=$(printf '%s\n' "$want" | LC_ALL=C sort)
          if [ "$got" != "$want" ]; then
            echo "check-evidence-ids did not refuse exactly the twenty lines. It refused:"
            echo "$got"
            exit 1
          fi
          case "$said" in
            *MADEUPPC01*|*00000000*)
              echo "check-evidence-ids printed the made up name or a fabricated id, which it must never print"
              exit 1
              ;;
          esac
          echo "check-evidence-ids refused exactly the twenty lines, passed the near miss, the masked copy and the rules fixtures, and printed no name and no id"

      # F102. The check and the mask read the rules file by one set of rules, so a green
      # check means the mask can read the same file. Each fixture under
      # tools/checks/broken/rules is put in place of the rules file in a copy of the two
      # scripts: valid.txt both must read, and every other one, each valid.txt with one
      # fault, both must refuse.
      - name: The check and the mask read a rules file the same way
        shell: bash
        run: |
          for fixture in tools/checks/broken/rules/*.txt; do
            t="$RUNNER_TEMP/f102rules"
            rm -rf "$t"
            mkdir -p "$t/tools/checks" "$t/tools/loop" "$t/read"
            cp tools/checks/check-evidence-ids.sh "$t/tools/checks/"
            cp tools/loop/mask-evidence.ps1 "$t/tools/loop/"
            cp "$fixture" "$t/tools/checks/evidence-ids.txt"
            printf 'a fabricated line with nothing to find\n' > "$t/read/plain.txt"
            check=0
            said=$(COMPUTERNAME=MADEUPPC01 sh "$t/tools/checks/check-evidence-ids.sh" "$t/read" 2>&1) || check=$?
            mask=0
            masked=$(COMPUTERNAME=MADEUPPC01 powershell -NoProfile -ExecutionPolicy Bypass -File "$t/tools/loop/mask-evidence.ps1" -In "$t/read/plain.txt" -Out "$t/out/plain.txt") || mask=$?
            echo "$fixture: the check answered $check, the mask answered $mask"
            case "$fixture" in
              */valid.txt)
                if [ "$check" -ne 0 ] || [ "$mask" -ne 0 ]; then
                  echo "$said"
                  echo "$masked"
                  echo "both must read $fixture"
                  exit 1
                fi
                ;;
              *)
                case "$said" in *"the rules file cannot be read"*) ;; *) check=0 ;; esac
                case "$masked" in *"the rules file cannot be read"*) ;; *) mask=0 ;; esac
                if [ "$check" -ne 2 ] || [ "$mask" -ne 1 ]; then
                  echo "$said"
                  echo "$masked"
                  echo "both must refuse $fixture as a rules file they cannot read"
                  exit 1
                fi
                ;;
            esac
          done
          echo "both read valid.txt and both refused every rules fixture with a fault"

      # F102. The mask, on every run. windows-latest has Windows PowerShell 5.1. Its copy of
      # the fabricated ids must be byte for byte the masked copy kept beside them, and pass
      # the check. The made up name inside a longer word, which the mask leaves, must be
      # refused on its read back with nothing written. Neither prints the name or an id.
      - name: The mask writes a copy the check passes and refuses what it leaves
        shell: bash
        run: |
          out="$RUNNER_TEMP/f102"
          mkdir -p "$out"
          status=0
          said=$(COMPUTERNAME=MADEUPPC01 powershell -NoProfile -ExecutionPolicy Bypass -File tools/loop/mask-evidence.ps1 -In tools/checks/broken/EvidenceWithIds.txt -Out "$out/EvidenceWithIds.txt") || status=$?
          echo "$said"
          if [ "$status" -ne 0 ]; then
            echo "mask-evidence answered $status on the fabricated ids, and it has to write the copy with 0"
            exit 1
          fi
          if ! cmp tools/checks/broken/EvidenceWithIds.masked.txt "$out/EvidenceWithIds.txt"; then
            echo "the mask's copy is not byte for byte EvidenceWithIds.masked.txt"
            exit 1
          fi
          COMPUTERNAME=MADEUPPC01 sh tools/checks/check-evidence-ids.sh "$out"
          status=0
          left=$(COMPUTERNAME=MADEUPPC01 powershell -NoProfile -ExecutionPolicy Bypass -File tools/loop/mask-evidence.ps1 -In tools/checks/broken/EvidenceLeftByMask.txt -Out "$out/left.txt") || status=$?
          echo "$left"
          if [ "$status" -ne 1 ]; then
            echo "mask-evidence answered $status on a name it leaves, and it has to refuse it with 1"
            exit 1
          fi
          case "$left" in
            *"the machine name is still on line 2"*) ;;
            *) echo "mask-evidence did not name the kind and the line it refused"; exit 1 ;;
          esac
          if [ -e "$out/left.txt" ]; then
            echo "mask-evidence left its refused copy behind"
            exit 1
          fi
          case "$said$left" in
            *MADEUPPC01*|*00000000*)
              echo "mask-evidence printed the made up name or a fabricated id, which it must never print"
              exit 1
              ;;
          esac
          echo "the mask wrote the expected copy, the check passed it, and the read back refused what the mask leaves"
